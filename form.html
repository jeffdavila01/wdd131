<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Product Review Form</title>
    <meta name="author" content="Jeffrey Davila">
    <meta name="description" content="Submit a product review by rating the product, selecting useful features, choosing the installation date, and sharing your feedback.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product</option>
            </select>

            <!-- RATING: Label above, radio below, in a row -->
            <fieldset class="rating-group">
                <legend>Overall Rating</legend>
                <div class="rating-row">
                    <div class="rating-option">
                        <label for="rating1">☆</label>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </div>
                    <div class="rating-option">
                        <label for="rating2">☆☆</label>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </div>
                    <div class="rating-option">
                        <label for="rating3">☆☆☆</label>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </div>
                    <div class="rating-option">
                        <label for="rating4">☆☆☆☆</label>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </div>
                    <div class="rating-option">
                        <label for="rating5">☆☆☆☆☆</label>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            <label for="date">Date of Installation</label>
            <input type="date" id="date" name="date" required>

            <!-- FEATURES: Full-width checkbox rows -->
            <fieldset class="features-group">
                <legend>Useful Features</legend>
                <span class="features-hint">Which features did you find useful? (Check all that apply)</span>
                
                <div class="feature-row">
                    <input type="checkbox" id="feature1" name="features" value="Durability">
                    <label for="feature1">Durability</label>
                </div>
                <div class="feature-row">
                    <input type="checkbox" id="feature2" name="features" value="Ease of Use">
                    <label for="feature2">Ease of Use</label>
                </div>
                <div class="feature-row">
                    <input type="checkbox" id="feature3" name="features" value="Performance">
                    <label for="feature3">Performance</label>
                </div>
                <div class="feature-row">
                    <input type="checkbox" id="feature4" name="features" value="Design">
                    <label for="feature4">Design</label>
                </div>
            </fieldset>

            <label for="review">Written Product Review</label>
            <textarea id="review" name="review"></textarea>

            <label for="username">User Name</label>
            <input type="text" id="username" name="username" autocomplete="name">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Jeffrey Papauran Davila 😊 Philippines
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
